name: Actualizador Automatico

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          # Esto ayuda a cachear las librerías para que sea más rápido
          cache: 'npm'

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Librerías necesarias para que Chrome/Puppeteer corra en Linux
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2 libxss1
          npm install puppeteer axios

      - name: Run Update Script
        # OJO: Aunque el archivo termine en .py, si el código es JS, usamos node
        run: node actualizar_lista.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Bot Mira TV"
          git config --global user.email "bot@mira-tv-gratis.com"
          git add canales.json lista.m3u || true
          git commit -m "Actualizacion automatica de enlaces (América TV)" || echo "No hay cambios para commitear"
          git push
