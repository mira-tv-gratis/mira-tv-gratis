name: Actualizador Automatico

on:
  schedule:
    - cron: '0 */6 * * *' # Cada 6 horas
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios

      - name: Run Update Script
        # Ahora ejecutamos el archivo JS que limpiamos anteriormente
        run: node actualizar_lista.js

      - name: Commit and push changes
        run: |
          git config --global user.name "Bot Mira TV"
          git config --global user.email "bot@mira-tv-gratis.com"
          git add canales.json
          # Solo hace commit si hay cambios reales en el archivo
          git commit -m "Actualizacion automatica de enlaces" || echo "No hay cambios para commitear"
          git push
